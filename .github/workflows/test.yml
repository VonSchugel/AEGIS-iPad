name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install host test prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv
      - uses: actions/checkout@v4
      - name: Create isolated environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check
      - name: Run fixture and local process tests
        run: .venv/bin/python -m pytest -q -W error
      - name: Run fixture-only smoke test
        run: .venv/bin/aegis simulate
