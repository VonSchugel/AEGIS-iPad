[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ipad"
version = "0.1.0"
description = "Evidence-based, approval-gated iPad research orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.7", "click==8.2.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.0.0"]
usb = ["pyusb==1.3.1"]
analysis = ["lief==0.16.6", "capstone==5.0.6"]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Repository = "https://github.com/VonSchugel/AEGIS-iPad"
Documentation = "https://github.com/VonSchugel/AEGIS-iPad/blob/main/docs/debian.md"
Issues = "https://github.com/VonSchugel/AEGIS-iPad/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aegis.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
